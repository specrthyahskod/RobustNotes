[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-robustnotes-anna"
version = "0.1.0"
description = "Executa for the robustnotes-anna Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-robustnotes-anna" = "robustnotes_anna_plugin:main"

[tool.setuptools]
py-modules = ["robustnotes_anna_plugin"]
